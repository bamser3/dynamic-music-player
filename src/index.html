<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <link rel="stylesheet" href="../bin/output.css" />
    <script src="./js/main.js" defer></script>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-gray-800">
            <div id="body-gradient" class="absolute inset-0 z-[-1] opacity-80"></div>

<!-- add these two gradient layers for cross-fade -->
<div id="gradient-bg-a" class="absolute inset-0 z-0" style="opacity:0;"></div>
<div id="gradient-bg-b" class="absolute inset-0 z-0" style="opacity:0;"></div>

    <div
      id="player-container"
      class="fixed inset-0 flex flex-col items-center justify-center p-6 overflow-hidden"
  >

      <div class="relative z-10">
    <audio id="audio"></audio>
    <img
      id="albumn-art"
      src="./images/iwidbCover.jpg"
      alt="Albumn Art"
      class="w-72 h-72 object-cover rounded-md mb-4 mx-auto"
    />
      <div id="song-info" class="text-center mb-4">
      <p id="song-title" class="text-white text-lg font-semibold">
        Song Title
      </p>
      <p id="song-artist" class="text-sm text-gray-400">Artist Name</p>
    </div>
      <div id="controls" class="flex justify-center gap-4 mb-4">
        <button id="prev">  
          <svg
            width="20px"
            height="20px"
            viewBox="0 0 24 24"
            fill="#fff"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M20.2409 7.21957V16.7896C20.2409 18.7496 18.1109 19.9796 16.4109 18.9996L12.2609 16.6096L8.11094 14.2096C6.41094 13.2296 6.41094 10.7796 8.11094 9.79957L12.2609 7.39957L16.4109 5.00957C18.1109 4.02957 20.2409 5.24957 20.2409 7.21957Z"
              fill="#fff"
            />
            <path
              d="M3.76172 18.9303C3.35172 18.9303 3.01172 18.5903 3.01172 18.1803V5.82031C3.01172 5.41031 3.35172 5.07031 3.76172 5.07031C4.17172 5.07031 4.51172 5.41031 4.51172 5.82031V18.1803C4.51172 18.5903 4.17172 18.9303 3.76172 18.9303Z"
              fill="#fff"
            />
          </svg>
        </button>
        <button id="play">
          <svg
            width="20px"
            height="20px"
            viewBox="0 0 15 15"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M4.79062 2.09314C4.63821 1.98427 4.43774 1.96972 4.27121 2.05542C4.10467 2.14112 4 2.31271 4 2.5V12.5C4 12.6873 4.10467 12.8589 4.27121 12.9446C4.43774 13.0303 4.63821 13.0157 4.79062 12.9069L11.7906 7.90687C11.922 7.81301 12 7.66148 12 7.5C12 7.33853 11.922 7.18699 11.7906 7.09314L4.79062 2.09314Z"
              fill="#fff"
            />
          </svg>
        </button>
        <button id="next">
          <svg
            width="20px"
            height="20px"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M3.76172 7.21957V16.7896C3.76172 18.7496 5.89172 19.9796 7.59172 18.9996L11.7417 16.6096L15.8917 14.2096C17.5917 13.2296 17.5917 10.7796 15.8917 9.79957L11.7417 7.39957L7.59172 5.00957C5.89172 4.02957 3.76172 5.24957 3.76172 7.21957Z"
              fill="#fff"
            />
            <path
              d="M20.2383 18.9303C19.8283 18.9303 19.4883 18.5903 19.4883 18.1803V5.82031C19.4883 5.41031 19.8283 5.07031 20.2383 5.07031C20.6483 5.07031 20.9883 5.41031 20.9883 5.82031V18.1803C20.9883 18.5903 20.6583 18.9303 20.2383 18.9303Z"
              fill="#fff"
            />
          </svg>
        </button>
      </div>
      <!-- added id="track" for reliable selection in JS -->
      <div id="track" class="w-full h-2 bg-gray-600 rounded-full relative mt-4 group">
        <div
          id="progress-filled"
          class="h-2 bg-green-500 rounded-full w-0"
        ></div>

        <div
          id="progress-thumb"
          class="w-4 h-4 bg-green-500 rounded-full absolute top-1/2 -translate-y-1/2 left-0 shadow-lg opacity-0 group-hover:opacity-100 transition-opacity duration-200"
        ></div>
      </div>
    </div>
  </body>
</html>
