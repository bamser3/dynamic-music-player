<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <script src="./js/main.js" defer></script>
    <link rel="stylesheet" href="../bin/output.css" />
  </head>
  <body class="min-h-screen bg-gray-900 text-white overflow-hidden"></body>
  <!-- Background Gradient -->
  <div id="app-bg" class="fixed inset-0 -z-10">
    <div id="gradient-bg-a" class="absolute inset-0 opacity-0"></div>
    <div id="gradient-bg-b" class="absolute inset-0 opacity-0"></div>
  </div>

  <!-- Music Cover / Info -->
  <div class="flex items-center justify-center h-screen gap-12">
    <!-- Albumn Cover-->
    <img
      id="albumn-art"
      class="w-140 h-140 rounded-lg object-cover shadow-2xl"
    />
    <div class="flex flex-col gap-6">
      <!-- Artist Info / Next in Queue -->
      <div
        id="artist-info"
        class="flex flex-col gap-4 p-6 rounded-lg bg-cover bg-center text-white shadow-lg min-w-md max-w-md h-96"
      >
        <p id="artist-title" class="text-xl font-semibold mb-45">
          About the artist
        </p>
        <p id="artist-name" class="text-lg font-bold">Artist name</p>
        <p id="artist-description" class="text-white/80 text-sm">
          Short description about the artist goes here.
        </p>
      </div>
      <!-- Next in queue -->
      <div
        id="next-song"
        class="flex flex-col gap-2 p-2 rounded-lg border border-white/30 bg-black/40 p-4 min-w-md max-w-md"
      >
        <p class="text-white text-xl font-semibold">Next in queue</p>
        <div class="flex flex-row gap-6">
          <img id="next-song-art" class="w-16 h-16 rounded-lg shadow-2xl" />
          <!-- Song Info Div -->
          <div>
            <p id="next-song-title" class="text-white font-semibold">
              Song title
            </p>
            <p id="next-song-artist" class="text-white/70 text-sm">
              Artist name
            </p>
          </div>
          <!---->
        </div>
      </div>
      <!---->
    </div>
  </div>

  <!-- Now playing title -->
  <div class="fixed top-4 left-4 z-20 max-w-xs">
    <p id="song-title" class="text-lg font-semibold"></p>
    <p id="song-artist" class="text-sm text-white/60"></p>
  </div>

  <!-- Floating Player -->
  <div
    id="player"
    class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 w-[min(96%,42rem)] rounded-2xl bg-black/40 backdrop-blur-xl shadow-2xl p-4"
  >
    <audio id="audio"></audio>
    <div class="flex items-center gap-4">
      <!-- Controls -->
      <div class="flex items-center gap-3">
        <button id="prev">
          <svg
            width="20px"
            height="20px"
            viewBox="0 0 24 24"
            fill="#fff"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M20.2409 7.21957V16.7896C20.2409 18.7496 18.1109 19.9796 16.4109 18.9996L12.2609 16.6096L8.11094 14.2096C6.41094 13.2296 6.41094 10.7796 8.11094 9.79957L12.2609 7.39957L16.4109 5.00957C18.1109 4.02957 20.2409 5.24957 20.2409 7.21957Z"
              fill="#fff"
            />
            <path
              d="M3.76172 18.9303C3.35172 18.9303 3.01172 18.5903 3.01172 18.1803V5.82031C3.01172 5.41031 3.35172 5.07031 3.76172 5.07031C4.17172 5.07031 4.51172 5.41031 4.51172 5.82031V18.1803C4.51172 18.5903 4.17172 18.9303 3.76172 18.9303Z"
              fill="#fff"
            />
          </svg>
        </button>
        <button id="play">
          <svg
            width="20px"
            height="20px"
            viewBox="0 0 15 15"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M4.79062 2.09314C4.63821 1.98427 4.43774 1.96972 4.27121 2.05542C4.10467 2.14112 4 2.31271 4 2.5V12.5C4 12.6873 4.10467 12.8589 4.27121 12.9446C4.43774 13.0303 4.63821 13.0157 4.79062 12.9069L11.7906 7.90687C11.922 7.81301 12 7.66148 12 7.5C12 7.33853 11.922 7.18699 11.7906 7.09314L4.79062 2.09314Z"
              fill="#fff"
            />
          </svg>
        </button>
        <button id="next">
          <svg
            width="20px"
            height="20px"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M3.76172 7.21957V16.7896C3.76172 18.7496 5.89172 19.9796 7.59172 18.9996L11.7417 16.6096L15.8917 14.2096C17.5917 13.2296 17.5917 10.7796 15.8917 9.79957L11.7417 7.39957L7.59172 5.00957C5.89172 4.02957 3.76172 5.24957 3.76172 7.21957Z"
              fill="#fff"
            />
            <path
              d="M20.2383 18.9303C19.8283 18.9303 19.4883 18.5903 19.4883 18.1803V5.82031C19.4883 5.41031 19.8283 5.07031 20.2383 5.07031C20.6483 5.07031 20.9883 5.41031 20.9883 5.82031V18.1803C20.9883 18.5903 20.6583 18.9303 20.2383 18.9303Z"
              fill="#fff"
            />
          </svg>
        </button>
      </div>

      <!-- Progress -->
      <div class="flex-1 mx-4">
        <div
          id="track"
          class="h-2 bg-white/20 rounded-full relative group cursor-pointer overflow-visible"
        >
          <!-- filled bar -->
          <div id="progress-filled" class="h-2 bg-white rounded-full w-0"></div>

          <!-- thumb -->
          <div
            id="progress-thumb"
            class="w-3 h-3 bg-white rounded-full absolute top-1/2 left-0 -translate-y-1/2 border border-black/40 opacity-0 group-hover:opacity-100 transition-opacity"
          ></div>
        </div>
      </div>
      <!-- Volume -->
      <input
        id="volume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        class="w-24 h-2 bg-black/40 rounded-full accent-indigo-500"
      />
    </div>
  </div>
</html>
